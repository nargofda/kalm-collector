name: 수집

# 깃허브의 10분 예약은 붐비면 그냥 건너뛴다 (실측 1~3시간 간격이었다).
# 그래서 예약은 4시간마다 한 번만 받고, 시작되면 그 안에서 10분마다 돈다.
# 다음 예약이 겹치면 새 것이 이어받는다(concurrency).
on:
  schedule:
    - cron: '5 */4 * * *'       # 4시간마다 — 가까운 10일, 안에서 10분 간격
  workflow_dispatch:
    inputs:
      days:
        description: '며칠치를 볼지'
        default: '10'
      offset:
        description: '며칠 뒤부터 볼지'
        default: '0'
      loop:
        description: '몇 분 동안 반복할지 (0이면 한 번만)'
        default: '0'

concurrency:
  group: kalm-near
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 260          # 4시간 20분. 다음 예약과 조금 겹치게 둔다
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      - name: 수집
        env:
          KALM_KEY: ${{ secrets.KALM_KEY }}
        run: |
          DAYS="${{ inputs.days }}";   DAYS="${DAYS:-10}"
          OFF="${{ inputs.offset }}";  OFF="${OFF:-0}"
          LOOP="${{ inputs.loop }}";   LOOP="${LOOP:-250}"
          echo "범위 ${OFF}일 뒤부터 ${DAYS}일 / ${LOOP}분 동안 10분마다"
          node collect.js --days "$DAYS" --offset "$OFF" --loop "$LOOP" --every 600
